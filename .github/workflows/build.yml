name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # needed to attach the APK to a release for tagged builds

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  # SHA-256 of the release signing certificate. Public information, and the guard that
  # stops a build signed with any other key from ever being published: Android would
  # refuse to install it over the existing app.
  EXPECTED_CERT_SHA256: 0897c8b37e993ddba33d77b42fcb8c947fa1cb0ab3d7d9025aa86780e7ce4e41

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Check signing secrets
        env:
          STEP_KEYSTORE_BASE64: ${{ secrets.STEP_KEYSTORE_BASE64 }}
          STEP_KEYSTORE_PASSWORD: ${{ secrets.STEP_KEYSTORE_PASSWORD }}
          STEP_KEY_ALIAS: ${{ secrets.STEP_KEY_ALIAS }}
          STEP_KEY_PASSWORD: ${{ secrets.STEP_KEY_PASSWORD }}
        run: |
          missing=""
          for name in STEP_KEYSTORE_BASE64 STEP_KEYSTORE_PASSWORD STEP_KEY_ALIAS STEP_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. See 'Signing' in README.md."
            exit 1
          fi
          echo "$STEP_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/step-release.p12"

      - name: Build signed release APK
        env:
          STEP_KEYSTORE_FILE: ${{ runner.temp }}/step-release.p12
          STEP_KEYSTORE_PASSWORD: ${{ secrets.STEP_KEYSTORE_PASSWORD }}
          STEP_KEY_ALIAS: ${{ secrets.STEP_KEY_ALIAS }}
          STEP_KEY_PASSWORD: ${{ secrets.STEP_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Verify signature
        run: |
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)"
          # The label in front of the digest differs between apksigner versions
          # ("Signer #1 ..." or "Signer (minSdkVersion=...) ..."), so match only the common part.
          actual="$("$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk \
            | grep -oiE 'certificate SHA-256 digest: [0-9a-f]{64}' | head -n 1 | grep -oE '[0-9a-f]{64}$' || true)"
          echo "::notice::Signing certificate SHA-256: ${actual:-not found} ($(basename "$(dirname "$apksigner")"))"
          if [ "$actual" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::APK is not signed with the expected release key."
            exit 1
          fi

      - name: Name the APK
        id: apk
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then version="${GITHUB_REF_NAME#v}"; else version="dev"; fi
          file="step-${version}-build${GITHUB_RUN_NUMBER}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$file"
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.apk.outputs.file }}
          path: ${{ steps.apk.outputs.file }}
          if-no-files-found: error

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          APK_FILE: ${{ steps.apk.outputs.file }}
        # The tag may come from a plain "git push" or from a release drafted on github.com.
        # In the second case the release already exists and only needs the APK attached.
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$APK_FILE" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$APK_FILE" --title "Step ${GITHUB_REF_NAME#v}" --generate-notes
          fi

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/step-release.p12"
